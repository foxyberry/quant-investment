services:
  db:
    image: postgres:16-alpine
    container_name: quant-db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-quant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-quant}
      POSTGRES_DB: ${DB_NAME:-quant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-quant} -d ${DB_NAME:-quant}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: quant-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=false
      - DATABASE_URL=postgresql://${DB_USER:-quant}:${DB_PASSWORD:-quant}@db:5432/${DB_NAME:-quant}
      - WORLDMONITOR_API_URL=http://worldmonitor:8080
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: quant-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Worldmonitor — global macro intelligence (optional)
  # Start with: docker compose --profile worldmonitor up -d
  # ---------------------------------------------------------------------------
  worldmonitor-redis:
    image: redis:7-alpine
    container_name: quant-wm-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - wm-redis-data:/data
    profiles: [worldmonitor]
    restart: unless-stopped

  worldmonitor-redis-rest:
    build:
      context: https://github.com/koala73/worldmonitor.git
      dockerfile: Dockerfile.redis-rest
    container_name: quant-wm-redis-rest
    ports:
      - "127.0.0.1:8079:80"
    environment:
      REDIS_URL: redis://worldmonitor-redis:6379
    depends_on:
      - worldmonitor-redis
    profiles: [worldmonitor]
    restart: unless-stopped

  worldmonitor:
    build:
      context: https://github.com/koala73/worldmonitor.git
    container_name: quant-wm
    ports:
      - "${WM_PORT:-3002}:8080"
    environment:
      UPSTASH_REDIS_REST_URL: http://worldmonitor-redis-rest:80
      UPSTASH_REDIS_REST_TOKEN: wm-local-token
      LOCAL_API_PORT: "8080"
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      - worldmonitor-redis-rest
    profiles: [worldmonitor]
    restart: unless-stopped

volumes:
  pgdata:
    name: quant-investment-pgdata
  wm-redis-data:
    name: quant-wm-redis-data

networks:
  default:
    name: quant-network
