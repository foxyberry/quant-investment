name: Visual Review

on:
  pull_request:
    branches: [main]

concurrency:
  group: visual-review-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  visual-snapshots:
    name: Visual Snapshot Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js
        run: npm run build

      - name: Check for existing baselines
        id: baselines
        run: |
          if ls e2e/visual.spec.ts-snapshots/*.png 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No visual baselines found. Skipping visual diff."
          fi

      - name: Run visual snapshot tests
        if: steps.baselines.outputs.exists == 'true'
        id: visual-test
        run: npx playwright test e2e/visual.spec.ts --project=chromium
        continue-on-error: true

      - name: Upload visual diff artifacts
        if: steps.baselines.outputs.exists == 'true' && steps.visual-test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-results
          path: web/test-results/
          retention-days: 14

      - name: Comment on PR with visual diff notice
        if: steps.baselines.outputs.exists == 'true' && steps.visual-test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "## Visual Regression Detected

          Visual snapshot tests found differences. Please review the visual diffs.

          **Download the \`visual-diff-results\` artifact** from the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) to inspect screenshots and diff images.

          If the changes are intentional, update the baseline snapshots and push again."

      - name: Fail if visual diffs detected
        if: steps.baselines.outputs.exists == 'true' && steps.visual-test.outcome == 'failure'
        run: exit 1
